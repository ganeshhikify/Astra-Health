# ==============================================================================
# ASTRA HEALTH - Alembic Migration Configuration
# ==============================================================================

[alembic]
# Path to migration scripts
script_location = migrations

# Prepend application root to sys.path so app modules are discoverable
prepend_sys_path = .

# Version locations
version_locations = %(here)s/migrations/versions

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Set to 'true' to run the environment during the 'revision' command
# regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# corresponding .py file to be considered as revisions
# sourceless = false

# Database URL fallback (overridden dynamically in migrations/env.py by settings.database_url)
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/astra_health

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
